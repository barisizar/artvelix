<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#3032e8">
  <title>Sayfa bulunamadı — Artvelix</title>
  <base href="/">
  <script>if(location.hostname === 'barisizar.github.io') document.querySelector('base').href = '/artvelix/';</script>
  <link rel="icon" type="image/svg+xml" href="assets/artvelix/favicon.svg">
  <link rel="stylesheet" href="assets/artvelix/brand.css?v=artvelix-3">
  <style>
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;background:var(--av-paper,#faf8f2);color:var(--av-ink,#22231f);font-family:Artvelix,Arial,sans-serif}
    header,main,footer{width:min(1120px,100% - 48px);margin-inline:auto}
    header{padding-block:32px;border-bottom:1px solid #deded1}
    main{padding-block:clamp(56px,10vw,120px)}
    .error-code{margin:0 0 20px;color:var(--av-blue,#3032e8);font-size:clamp(96px,20vw,200px);font-weight:750;line-height:.9;letter-spacing:-.07em}
    h1{margin:0 0 18px;font-size:clamp(32px,5vw,54px);font-weight:550;line-height:1.1;letter-spacing:-.04em}
    .description{max-width:500px;margin:0;font-size:17px;line-height:1.7;color:#686661}
    nav{display:flex;flex-wrap:wrap;gap:16px;margin-top:32px}
    nav a{display:inline-flex;align-items:center;justify-content:center;min-height:48px;padding:14px 22px;border:1px solid var(--av-blue,#3032e8);border-radius:2px;color:var(--av-blue,#3032e8);font-size:14px;text-decoration:none}
    nav a:first-child{background:var(--av-blue,#3032e8);color:var(--av-paper,#faf8f2)}
    a:focus-visible{outline:3px solid var(--av-blue,#3032e8);outline-offset:5px}
    footer{padding-block:24px;border-top:1px solid #deded1;font-size:11px;letter-spacing:1.5px}
    @media(max-width:480px){header,main,footer{width:calc(100% - 40px)}nav{flex-direction:column;align-items:stretch}}
  </style>
</head>
<body>
  <header>
    <a class="artvelix-brand" href="./" aria-label="Artvelix — Ana sayfa"><svg class="av-mark" viewBox="0 0 40 40" fill="none" aria-hidden="true"><rect width="40" height="40" rx="11" fill="currentColor"/><path d="M9 29 18.2 10h4L31 29h-5.6l-1.5-3.5h-9.4L13 29H9Zm7.3-7.7h5.8l-2.9-6.7-2.9 6.7Z" fill="#faf8f2"/><circle cx="30" cy="10" r="3" fill="#d8ee76"/></svg><span class="av-type"><span class="av-name">artvelix<span class="av-dot">.</span></span><small class="av-tagline">SANATLA, HER GÜN.</small></span></a>
  </header>
  <main>
    <p class="error-code" aria-hidden="true">404</p>
    <h1>Bu sayfayı bulamadık.</h1>
    <p class="description">Bağlantı değişmiş ya da adres yanlış yazılmış olabilir. Artvelix dünyasını keşfetmeye devam edebilirsin.</p>
    <nav aria-label="Keşfetmeye devam et">
      <a href="./">Ana sayfaya dön ↗</a>
      <a href="all-products.html#collection">Tüm ürünleri keşfet ↗</a>
    </nav>
  </main>
  <footer>ARTVELIX / SANATLA, HER GÜN.</footer>
</body>
</html>
